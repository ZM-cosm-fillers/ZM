<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZM COSM. FILLERS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #a00000;
    }

    body {
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 711px;
      line-height: 0;
    }

    .card img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hotspot {
      position: absolute;
      display: block;
      z-index: 10;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Номер телефона */
    .phone-number {
      left: 8%;
      top: 76.4%;
      width: 47%;
      height: 7%;
    }

    /* Кнопка ПОЗВОНИТЬ */
    .call-button {
      left: 2%;
      top: 84.2%;
      width: 47%;
      height: 8.7%;
    }

    /* Кнопка WHATSAPP */
    .whatsapp-button {
      left: 51%;
      top: 84.2%;
      width: 47%;
      height: 8.7%;
    }
  </style>
</head>

<body>

  <main class="card">

    <img src="card.png" alt="ZM COSM. FILLERS">

    <a
      class="hotspot phone-number"
      href="tel:+79380808686"
      aria-label="Позвонить 8-938-080-86-86">
    </a>

    <a
      class="hotspot call-button"
      href="tel:+79380808686"
      aria-label="Позвонить">
    </a>

    <a
      class="hotspot whatsapp-button"
      href="https://wa.me/79380808686"
      target="_blank"
      rel="noopener"
      aria-label="Написать в WhatsApp">
    </a>

  </main>

</body>
</html>
